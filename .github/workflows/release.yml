# Publishes the manifest's version as a GitHub release: checks, packs, and attaches the `.hshader`
# and the friend-ready zip. Runs on a `v*` tag, or straight from the Actions tab (Run workflow on
# main) — in that case the tag `v<version>` is created at the commit the run checked out, so no
# command line is needed and the tag can never disagree with the manifest.
#
# The checker comes from Horizon's newest nightly, like check.yml: Horizon's stable tags lag the
# shader API line, and `tools/ci.py` builds it once into `.ci/bin/<sha>/`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Horizon's newest nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "HORIZON_SHA=$(gh api repos/horizon-rust/horizon/git/ref/tags/nightly -q .object.sha)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci
      - name: The tag matches the pack's version
        run: |
          version=$(python3 tools/ci.py version)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME, manifest $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Package
        run: |
          python3 tools/ci.py package | tee package.json
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json
          data = json.load(open("package.json"))
          print("FILE=" + data["file"])
          print("SHA256=" + data["sha256"])
          print("ZIP=" + data["zip"])
          print("ZIP_SHA256=" + data["zip_sha256"])
          PY
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Vanilla Horizon $VERSION"
          notes="docs/release-notes-$VERSION.md"
          # A missing tag is created at the commit this run checked out; an existing release gets its
          # assets replaced, so re-running a release is safe.
          if [ -f "$notes" ]; then
            gh release create "$TAG" "$FILE" "$ZIP" --title "$title" --target "$GITHUB_SHA" --notes-file "$notes" \
              || gh release upload "$TAG" "$FILE" "$ZIP" --clobber
          else
            gh release create "$TAG" "$FILE" "$ZIP" --title "$title" --target "$GITHUB_SHA" --generate-notes \
              || gh release upload "$TAG" "$FILE" "$ZIP" --clobber
          fi
          echo "hshader sha256: $SHA256"
          echo "zip     sha256: $ZIP_SHA256"

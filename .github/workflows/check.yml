# Whether the pack still passes Horizon's own check, at Horizon's newest nightly.
#
# The checker is not a release: Horizon's stable tags lag the shader API line, so the nightly tag is
# the only reliable "newest 0.2" source (the same rule Petalveil's CI uses). `tools/ci.py` builds it
# once into `.ci/bin/<sha>/`; rust-cache keeps `.ci/target` warm between runs.
name: check

on:
  push:
    paths: ["pack/**", "tools/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["pack/**", "tools/**", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Horizon's newest nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "HORIZON_SHA=$(gh api repos/horizon-rust/horizon/git/ref/tags/nightly -q .object.sha)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci
      - name: Fast pre-flight (manifest, options, pages, pack-root files)
        run: python3 tools/check.py
      - name: Horizon's check (naga, SPIR-V/Metal/HLSL, every option at min and max)
        run: python3 tools/ci.py check
      - name: Package
        run: python3 tools/ci.py package | tee package.json
      - name: What the package holds
        run: |
          python3 - <<'PY'
          import json, zipfile
          data = json.load(open("package.json"))
          archive = zipfile.ZipFile(data["file"])
          names = sorted(archive.namelist())
          assert "horizon-shaders.toml" in names, names
          assert all(n.endswith(('.wgsl', '.toml', '.png', '.md', '.txt')) for n in names), names
          print(data["file"], data["sha256"], len(names), "files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-horizon-shader
          path: dist/*

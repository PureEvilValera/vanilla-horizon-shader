# Whether the pack still passes Horizon's own check, at the commit `tools/ci.py` pins. The tool is
# built from Horizon's crates once and cached; no game is compiled here.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `tools/ci.py` unpacks Horizon into .ci/horizon and builds into .ci/target (cached).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci
          # .ci/target is the build; the rest of .ci is fetched source and the built tool.
          cache-directories: .ci/bin
      - name: Fast pre-flight (manifest, options, pages, pack-root files)
        run: python3 tools/check.py
      - name: Horizon's check (naga, SPIR-V/Metal/HLSL, every option at min and max)
        run: python3 tools/ci.py check
      - name: Package
        run: python3 tools/ci.py package | tee package.json
      - name: What the package holds
        run: |
          python3 - <<'PY'
          import json, zipfile
          data = json.load(open("package.json"))
          archive = zipfile.ZipFile(data["file"])
          names = sorted(archive.namelist())
          assert "horizon-shaders.toml" in names, names
          assert all(n.endswith(('.wgsl', '.toml', '.png', '.md', '.txt')) for n in names), names
          print(data["file"], data["sha256"], len(names), "files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-horizon-shader
          path: dist/*

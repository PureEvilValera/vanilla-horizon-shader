schema = 1
id = "vanilla_horizon"
name = "Vanilla Horizon"
version = "2.11.0"
api = "0.2"
description = "Vanilla's own light, kept whole: the sun and the moon add to it and shadows take back only a bounded part of the sky's light, so caves, torches and night stay vanilla. Water with waves, a mirror and its own transparency, plus sun rays at dawn and dusk."
authors = ["pev"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky glow"
# The sun (vanilla's square one), the moon with its phases, the stars and the clouds stay the
# engine's own; this stage only adds the glow around the sun.
sun = true
clouds = true
stars = true

[material]
file = "material.wgsl"
name = "Terrain light and water"

[weather]
file = "weather.wgsl"
name = "Rain and snow"

[vertex]
file = "vertex.wgsl"
name = "Waving plants"

# The shadow pass draws the terrain again in the light's square, so its cost grows with the
# distance squared: 2048/128 is the default, and the options below are the way to pay less.
# 0.2: the pack fogs its own stages (it paints the haze itself), so Horizon skips its fog there.
[frame]
fog = "pack"

# The curve the linear picture goes through once per pixel of the window.
[tonemap]
file = "tonemap.wgsl"

[shadow]
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"
resolution = 2048
distance = 64.0
solid_materials = [1]

[reflection]
option = "water_reflections"

[[post]]
file = "post/rays.wgsl"
name = "Sun rays"
output = "vh_rays"
scale = 0.25

[[post]]
file = "post/glow_prefilter.wgsl"
name = "Glow prefilter"
output = "vh_glow"
scale = 0.25

[[post]]
file = "post/glow_blur.wgsl"
name = "Glow blur"
output = "vh_glow_b"
scale = 0.25

[[post]]
file = "post/frame.wgsl"
name = "Frame and rays"

[budget]
gpu_ms = 2.0

[[materials]]
id = 1
sprites = ["block/*_leaves", "block/vine"]

[[materials]]
id = 2
sprites = [
    "block/short_grass",
    "block/grass",
    "block/fern",
    "block/dandelion",
    "block/poppy",
    "block/_tulip",
    "block/oxeye_daisy",
    "block/cornflower",
    "block/allium",
    "block/azure_bluet",
    "block/blue_orchid",
    "block/lily_of_the_valley",
    "block/dead_bush",
    "block/_sapling",
    "block/wheat_stage*",
    "block/carrots_stage*",
    "block/potatoes_stage*",
    "block/beetroots_stage*",
]

# --- The block light these groups cast, and its colour ---

[[lights]]
color = [1.0, 0.62, 0.3]
blocks = ["torch", "wall_torch", "lantern", "campfire", "jack_o_lantern", "fire", "candle", "*_candle"]

[[lights]]
color = [0.35, 0.75, 1.0]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire", "soul_fire"]

[[lights]]
color = [1.0, 0.2, 0.12]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp"]

[[lights]]
color = [1.0, 0.85, 0.55]
blocks = ["glowstone", "shroomlight", "ochre_froglight", "pearlescent_froglight", "verdant_froglight", "end_rod"]

[[lights]]
color = [0.7, 0.95, 1.0]
blocks = ["sea_lantern", "beacon", "conduit"]

[[lights]]
color = [0.78, 0.48, 1.0]
blocks = ["amethyst_cluster", "*_amethyst_bud", "crying_obsidian", "nether_portal", "respawn_anchor"]


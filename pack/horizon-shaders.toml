# --- Sky glow ---------------------------------------------------------------------

[[options]]
id = "day_fog"
name = "Day fog"
description = "How thick the air is by day, against vanilla's fog: 1 is exactly vanilla, 0 none. The dawn and the dusk keep the pack's own thickness."
type = "float"
default = 0.35
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "cave_fog"
name = "Cave fog"
description = "How much of the fog stays where a face sees no sky at all: 0 clears the caves and the cellars, 1 keeps vanilla's fog underground."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "skyline"
name = "Skyline haze"
description = "Blends the far edge of the loaded terrain into the sky above it, so the end of the chunks is not a hard band; nearby trees and hills are left alone. 0 turns it off."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "bloom"
name = "Glow"
description = "A soft glow around what is brighter than white: the sun, its halo and bright clouds. 0 turns it off and saves two quarter-size passes."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

# --- Dawn -------------------------------------------------------------------------

[[options]]
id = "exposure"
name = "Exposure"
description = "The picture's exposure before the tone curve maps it to the display."
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "tone_curve"
name = "Tone curve"
description = "0 clips the picture at white the way the game does, 1 is the full filmic curve. Above about 0.5 the contrast stops reading as vanilla's."
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dawn_warmth"
name = "Dawn warmth"
description = "How orange the dawn's own light is at the horizon: 0 a neutral white, 1 a deep orange."
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dawn_orange"
name = "Dawn orange"
description = "How orange everything the sky lights turns at dawn. 0 leaves it untouched, 2 is a deep orange."
type = "float"
default = 0.75
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dawn_light"
name = "Dawn light"
description = "How much more light a low sun gives at dawn than its height alone would."
type = "float"
default = 0.5
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dawn_glow"
name = "Dawn glow"
description = "The halo and the wash of light around the sun, and the band along the horizon on its side."
type = "float"
default = 0.7
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dawn_glow_size"
name = "Dawn glow size"
description = "How far the glow reaches from the sun: 0.2 a tight halo, 4 a wash over half the sky."
type = "float"
default = 0.3
min = 0.2
max = 4.0
step = 0.05

[[options]]
id = "dawn_haze"
name = "Dawn haze"
description = "How much of the low sun's colour the far distance takes."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dawn_rays"
name = "Dawn rays"
description = "Light spilling from the sun at sunrise."
type = "float"
default = 0.1
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dawn_mist"
name = "Dawn mist"
description = "How thick the ground mist is at sunrise: 0 none, 1 a valley filled to `Mist height`, 2 twice as thick again."
type = "float"
default = 0.55
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dawn_rays_color"
name = "Dawn rays colour"
description = "Extra saturation of the rays: above 0 redder, below it yellower."
type = "float"
default = -0.25
min = -0.25
max = 0.5
step = 0.05

# --- Dusk -------------------------------------------------------------------------

[[options]]
id = "mist_height"
name = "Mist height"
description = "How many blocks above the sea the ground mist climbs before it thins out; the dawn and the dusk each have their own amount."
type = "float"
default = 3.5
min = 2.0
max = 16.0
step = 0.5

[[options]]
id = "mist_start"
name = "Mist distance"
description = "How many chunks from the player the mist starts: 0 has it from the camera, 1 keeps the first sixteen blocks clear, 3 the first forty-eight. It fades in over the next block and a half."
type = "float"
default = 1.0
min = 0.0
max = 8.0
step = 1.0

[[options]]
id = "dusk_warmth"
name = "Dusk warmth"
description = "How orange the sunset's own light is at the horizon: 0 a neutral white, 1 a deep orange."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dusk_orange"
name = "Dusk orange"
description = "How orange everything the sky lights turns at sunset. 0 leaves it untouched, 2 is a deep orange."
type = "float"
default = 2.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dusk_light"
name = "Dusk light"
description = "How much more light a low sun gives at sunset than its height alone would."
type = "float"
default = 0.3
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dusk_glow"
name = "Dusk glow"
description = "The halo and the wash of light around the sun, and the band along the horizon on its side."
type = "float"
default = 0.75
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dusk_glow_size"
name = "Dusk glow size"
description = "How far the glow reaches from the sun: 0.2 a tight halo, 4 a wash over half the sky."
type = "float"
default = 0.2
min = 0.2
max = 4.0
step = 0.05

[[options]]
id = "dusk_haze"
name = "Dusk haze"
description = "How much of the low sun's colour the far distance takes."
type = "float"
default = 0.2
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dusk_rays"
name = "Dusk rays"
description = "Light spilling from the sun at sunset."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "dusk_mist"
name = "Dusk mist"
description = "How thick the ground mist is at sunset: 0 none, 1 a valley filled to `Mist height`, 2 twice as thick again."
type = "float"
default = 0.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "dusk_rays_color"
name = "Dusk rays colour"
description = "Extra saturation of the rays: above 0 redder, below it yellower."
type = "float"
default = 0.5
min = -0.25
max = 0.5
step = 0.05

# --- Moon -------------------------------------------------------------------------

[[options]]
id = "night_mist"
name = "Night mist"
description = "The mist of the evening right after the sun sets: it thins as the night deepens and hands over to Midnight mist. 0 leaves the evening clear."
type = "float"
default = 2.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "midnight_mist"
name = "Midnight mist"
description = "The mist of the small hours, which Night mist hands over to as the night deepens. At 0 only the evening keeps its mist."
type = "float"
default = 0.65
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "moon_strength"
name = "Moonlight"
description = "The moon's own light and the long shadows it casts, the whole night through. 0 keeps vanilla's night exactly."
type = "float"
default = 2.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "moon_tint"
name = "Moon colour"
description = "0 is the pack's cool blue moonlight, 1 a warm white."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "moon_glow"
name = "Moon glow"
description = "A cool halo around the moon at night."
type = "float"
default = 0.2
min = 0.0
max = 2.0
step = 0.05

# --- Light and shadows ------------------------------------------------------------

[[options]]
id = "shadows"
name = "Shadows"
description = "Sun and moon shadows. They only shade the light that comes from the sky, so caves and the night stay vanilla. Off saves the most GPU time."
type = "bool"
default = true

[[options]]
id = "shadow_softness"
name = "Shadow edges"
description = "Sharp reads the shadow map once, soft four times and very soft nine times."
type = "choice"
values = ["Sharp", "Soft", "Very soft"]
default = "Soft"

[[options]]
id = "shadow_resolution"
name = "Shadow detail"
description = "The shadow map's size in texels. 1024 is the cheapest, 4096 the finest."
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far shadows reach, in blocks. Aurora's own profile uses 64 (low) to 192 (high) and 224 (ultra)."
type = "int"
default = 64
min = 64
max = 512

[[options]]
id = "shadow_strength"
name = "Shadow depth"
description = "How dark a shadow is: above 1 the shade deepens, 0 leaves the sun's light in shadows but stops it darkening anything."
type = "float"
default = 2.4
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How much the sun adds on top of vanilla's light. 0 is vanilla's own brightness; above it the sun lit faces get brighter."
type = "float"
default = 2.0
min = 0.0
max = 2.0
step = 0.05

# --- Glow of the blocks ------------------------------------------------------------

[[options]]
id = "block_light_warmth"
name = "Block light colour"
description = "How far the light these blocks cast takes their colour: a warm torch reads warmer on the walls, while the brightness stays vanilla's. 0 leaves it vanilla. The same shift lights the ground around a light source in your hand."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

# --- Water ------------------------------------------------------------------------

[[options]]
id = "water_reflections"
name = "Water reflections"
description = "The world mirrored in the water's surface."
type = "bool"
default = true

[[options]]
id = "reflection_strength"
name = "Reflection strength"
description = "How much of the mirror the water shows; 0 is vanilla's flat colour."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_transparency"
name = "Water transparency"
description = "0 keeps vanilla's see-throughness, 1 is as clear as it goes."
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_waves"
name = "Waves"
description = "How steep the ripples in the water's surface are; 0 is a flat top."
type = "float"
default = 2.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "far_water"
name = "Far water"
description = "How strongly the far water dissolves into the horizon, so the end of the loaded chunks does not cut it off: 0 leaves the edge sharp, 1 hides it."
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "far_water_start"
name = "Far water distance"
description = "How many blocks before the render distance the far water starts to dissolve: small keeps it a thin band at the end of the chunks, large lets the far half of a lake haze over."
type = "float"
default = 320.0
min = 0.0
max = 320.0
step = 4.0

[[options]]
id = "sun_glint"
name = "Sun glint"
description = "The sun's or moon's glitter on the water; vanilla has none."
type = "float"
default = 0.2
min = 0.0
max = 2.0
step = 0.05

# --- Rain -------------------------------------------------------------------------

[[options]]
id = "rain_tint"
name = "Rain colour"
description = "The colour of the falling streaks: −1 vanilla's own, 0 the pack's cool blue, 1 its neutral grey; the slider blends between them."
type = "float"
default = 1.0
min = -1.0
max = 1.0
step = 0.05

[[options]]
id = "rain_brightness"
name = "Rain brightness"
description = "How bright the falling rain and snow are."
type = "float"
default = 1.85
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "rain_rings_ground"
name = "Rings on ground"
description = "The rings the drops make on soaked ground: a thin film, so a low value is almost transparent and 0 leaves the ground wet but still."
type = "float"
default = 0.05
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "rain_rings_water"
name = "Rings on water"
description = "The rings the drops make on the water, with their own strength; they also tilt the mirror and the glint."
type = "float"
default = 0.15
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "ring_density"
name = "Ring amount"
description = "How many drops land and spread a ring, on the ground and on the water together: 0 none, 1 the rain's own count, above it more."
type = "float"
default = 0.7
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "wet_ground"
name = "Wet ground"
description = "How much the rain darkens the ground and makes it catch the sky; 0 keeps it dry."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

# --- Nature -----------------------------------------------------------------------

[[options]]
id = "waving_plants"
name = "Waving plants"
description = "Vanilla's plants stand still; this sways leaves and flowers."
type = "bool"
default = true

[[options]]
id = "wind_calm"
name = "Wind"
description = "How hard the wind blows on a calm hour; 0 leaves leaves and blades still."
type = "float"
default = 0.2
min = 0.0
max = 3.0
step = 0.05

[[options]]
id = "wind_rain"
name = "Wind in rain"
description = "The wind while it rains."
type = "float"
default = 1.9
min = 0.0
max = 4.0
step = 0.05

[[options]]
id = "wind_thunder"
name = "Wind in a storm"
description = "The wind while it thunders."
type = "float"
default = 5.0
min = 0.0
max = 5.0
step = 0.05

changelog = """
Sunlight and shadows read again: the direct light and the shade share were converted to linear light
one power too low, so the sun barely showed on the ground and a shadow was a few percent of shade.
Skyline haze now follows the edge of the loaded terrain instead of the configured render distance, so
a server with a shorter view distance no longer draws the haze beyond the real edge; it mixes toward
the sky's colour too, so dusk and night no longer darken the last chunks.
Defaults retuned to the hand-tuned profile: fog off by default, Shadow edges Sharp, Shadow depth 1.50,
Block light colour 0.65, Water transparency 0.70, Far water 0.40 at 124 blocks, Night mist 1.20 and
Midnight mist 0.25, Wind 0.45.
"""
